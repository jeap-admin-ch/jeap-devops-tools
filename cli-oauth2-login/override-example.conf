# Example configuration for oidc-discovery-override.sh
#
# Format: KEY=value, one key per line; '#' starts a comment line (inline
# comments after a value are not supported); values may be double- or
# single-quoted. Keys correspond to the property names of the OIDC discovery
# document (snake_case).
#
# This file configures ONLY the discovery document (issuer + endpoint
# overrides). It is NOT an OAuth2 client configuration: the client id, client
# secret, scopes and flow are passed to oidc-gen, not set here.
#

# Required: the EXTERNAL issuer. It is always written into the result because
# OIDC clients (e.g. oidc-agent >= 5) enforce the issuer match.
issuer="https://auth.example.com/realms/example"

# Optional: explicit discovery endpoint (e.g. the internally reachable host).
# If absent, <issuer>/.well-known/openid-configuration is used.
oidc_provider_configuration_endpoint="https://auth.internal.example.com/realms/example/.well-known/openid-configuration"

# Optional: any number of *_endpoint / *_uri overrides (e.g. token_endpoint,
# jwks_uri). Only properties the auth server itself publishes in its discovery
# document are replaced; everything else is skipped with a warning (typo
# protection).
device_authorization_endpoint="https://auth.internal.example.com/realms/example/protocol/openid-connect/auth/device"
token_endpoint="https://auth.internal.example.com/realms/example/protocol/openid-connect/token"
revocation_endpoint="https://auth.internal.example.com/realms/example/protocol/openid-connect/revoke"

# Only needed for the browser-based authorization code flow; the device flow
# does not use the authorization_endpoint.
authorization_endpoint="https://auth.internal.example.com/realms/example/protocol/openid-connect/auth"
