    localisedName: jeap-devops-tools
    shortDescription: Supporting tools and documentation for developing, maintaining and operating jEAP-based applications
    longDescription: >
      jeap-devops-tools is a home for tools and documentation that help developers and DevOps
      engineers develop, maintain and operate jEAP-based applications. Each entry has its own
      documentation, and new tools and documentation may be added over time.

    features:
      - Obtain a personal, traceable OAuth2 access token on the command line for calling OIDC/OAuth2-protected endpoints with curl
      - Adapt an OIDC discovery document by overriding endpoints for developer machines (oidc-discovery-override.sh)
